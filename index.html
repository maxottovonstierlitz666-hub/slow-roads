<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#87b7d9">
<title>Slow Roads — бесконечная процедурная дорога</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b1016; color:#fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display:block; }
  #hud { position:fixed; top:0; left:0; right:0; padding:14px 16px; display:flex;
    justify-content:space-between; align-items:flex-start; pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,.55); }
  #speed { font-size:34px; font-weight:700; line-height:1; letter-spacing:-1px; }
  #speed span { font-size:12px; font-weight:500; opacity:.75; margin-left:4px; letter-spacing:0; }
  #dist { font-size:12px; opacity:.85; margin-top:5px; }
  #buttons { display:flex; gap:8px; pointer-events:auto; }
  .btn { border:none; background:rgba(12,18,26,.42); color:#fff; backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.16);
    border-radius:12px; padding:9px 12px; font-size:12px; font-weight:600; cursor:pointer;
    font-family:inherit; }
  .btn:active { transform:scale(.95); }
  #touch { position:fixed; left:0; right:0; bottom:0; padding:16px 18px calc(18px + env(safe-area-inset-bottom));
    display:none; justify-content:space-between; gap:14px; pointer-events:none; }
  .pad { display:flex; gap:12px; pointer-events:auto; }
  .key { width:64px; height:64px; border-radius:18px; background:rgba(12,18,26,.42);
    border:1px solid rgba(255,255,255,.16); backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center;
    font-size:22px; user-select:none; -webkit-user-select:none; touch-action:none; }
  .key:active { background:rgba(255,255,255,.26); }
  #hint { position:fixed; left:16px; bottom:16px; font-size:12px; opacity:.62; line-height:1.7;
    text-shadow:0 1px 4px rgba(0,0,0,.6); }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0b1016; font-size:14px; letter-spacing:.4px; z-index:10; text-align:center; padding:24px; }
  @media (max-width:820px){ #hint{display:none;} #speed{font-size:28px;} }
</style>
</head>
<body>
<div id="hud">
  <div>
    <div id="speed">0<span>км/ч</span></div>
    <div id="dist">0 км</div>
  </div>
  <div id="buttons">
    <button class="btn" id="btnTheme">День</button>
    <button class="btn" id="btnView">Вид</button>
    <button class="btn" id="btnPause">Пауза</button>
  </div>
</div>

<div id="touch">
  <div class="pad">
    <div class="key" data-k="left">◀</div>
    <div class="key" data-k="right">▶</div>
  </div>
  <div class="pad">
    <div class="key" data-k="down">▼</div>
    <div class="key" data-k="up">▲</div>
  </div>
</div>

<div id="hint">W / ↑ — газ&nbsp;&nbsp;·&nbsp;&nbsp;S / ↓ — тормоз<br>A / D — руль&nbsp;&nbsp;·&nbsp;&nbsp;P — пауза&nbsp;&nbsp;·&nbsp;&nbsp;C — вид</div>
<div id="loading">Строю дорогу…</div>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script>
(function () {
  'use strict';
  var T = window.THREE;
  var loadingEl = document.getElementById('loading');
  if (!T) {
    loadingEl.textContent = 'Не удалось загрузить three.js — нужен интернет при открытии.';
    return;
  }

  /* ==================== константы мира ==================== */
  var SEG = 4;            // шаг точек осевой линии, м
  var ROAD_HALF = 4.2;    // половина ширины полотна (=8.4 м)
  var AHEAD = 440;        // сколько метров дороги держим впереди
  var BEHIND = 70;        // сколько метров позади
  var MAX_SPEED = 46;     // м/с (~165 км/ч)
  var TREE_STEP = 7;      // шаг «слотов» для деревьев
  var TREE_CAP = 300;
  var MAX_PTS = 320;
  var GROUND_MAX_ROWS = 200;

  /* ==================== рендерер ==================== */
  var renderer;
  try {
    renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (e) {
    loadingEl.textContent = 'Браузер не поддерживает WebGL.';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (T.sRGBEncoding !== undefined) renderer.outputEncoding = T.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  var scene = new T.Scene();
  var camera = new T.PerspectiveCamera(64, window.innerWidth / window.innerHeight, 0.4, 1400);
  scene.fog = new T.Fog(0xcde7f7, 130, 520);

  /* ==================== небо ==================== */
  var skyUniforms = {
    top: { value: new T.Color(0x4a90d9) },
    bot: { value: new T.Color(0xcde7f7) }
  };
  var sky = new T.Mesh(
    new T.SphereGeometry(700, 24, 16),
    new T.ShaderMaterial({
      uniforms: skyUniforms,
      side: T.BackSide,
      depthWrite: false,
      vertexShader: [
        'varying vec3 vPos;',
        'void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }'
      ].join('\n'),
      fragmentShader: [
        'uniform vec3 top; uniform vec3 bot; varying vec3 vPos;',
        'void main(){',
        '  float h = clamp(normalize(vPos).y * 0.5 + 0.5, 0.0, 1.0);',
        '  vec3 c = mix(bot, top, pow(h, 0.9));',
        '  gl_FragColor = vec4(c, 1.0);',
        '}'
      ].join('\n')
    })
  );
  sky.renderOrder = -1;
  scene.add(sky);

  /* ==================== свет ==================== */
  var hemi = new T.HemisphereLight(0xcfe8ff, 0x4c6b3f, 0.9);
  scene.add(hemi);
  var sun = new T.DirectionalLight(0xfff6e0, 1.5);
  sun.position.set(-90, 130, 70);
  scene.add(sun);
  var ambient = new T.AmbientLight(0xffffff, 0.25);
  scene.add(ambient);

  /* ==================== генерация дороги ==================== */
  function curvature(s) {
    return 0.0034 * Math.sin(s * 0.0039 + 0.7) +
           0.0058 * Math.sin(s * 0.0016 + 2.3) +
           0.0024 * Math.sin(s * 0.0111 + 4.1);
  }
  function roadHeight(s) {
    return 2.0 * Math.sin(s * 0.0031 + 0.4) +
           1.0 * Math.sin(s * 0.0079 + 1.9) +
           0.4 * Math.sin(s * 0.0213);
  }
  function makePoint(s, prev) {
    if (!prev) return { s: s, x: 0, y: roadHeight(s), z: 0, h: 0 };
    var ds = s - prev.s;
    var h = prev.h + curvature(prev.s) * ds;
    return {
      s: s,
      x: prev.x + Math.sin(h) * ds,
      y: roadHeight(s),
      z: prev.z + Math.cos(h) * ds,
      h: h
    };
  }

  var pts = [makePoint(0, null)];

  function ensureRoad(sCar) {
    var added = false;
    var guard = 0;
    while (pts[pts.length - 1].s < sCar + AHEAD && guard++ < 400) {
      var last = pts[pts.length - 1];
      if (pts.length >= MAX_PTS) { pts.shift(); }
      pts.push(makePoint(last.s + SEG, last));
      added = true;
    }
    while (pts.length > 4 && pts[1].s < sCar - BEHIND) {
      pts.shift();
      added = true;
    }
    return added;
  }

  function pointAt(s) {
    var n = pts.length;
    if (n === 0) return { x: 0, y: 0, z: 0, h: 0, s: 0 };
    var raw = (s - pts[0].s) / SEG;
    var i0 = Math.floor(raw);
    if (i0 < 0) i0 = 0;
    if (i0 > n - 1) i0 = n - 1;
    var a = pts[i0];
    var b = pts[Math.min(n - 1, i0 + 1)];
    var t = 0;
    if (b.s > a.s) t = (s - a.s) / (b.s - a.s);
    if (t < 0) t = 0;
    if (t > 1) t = 1;
    return {
      x: a.x + (b.x - a.x) * t,
      y: a.y + (b.y - a.y) * t,
      z: a.z + (b.z - a.z) * t,
      h: a.h + (b.h - a.h) * t,
      s: s
    };
  }

  /* ==================== текстура асфальта ==================== */
  function makeRoadTexture() {
    var w = 128, h = 512;
    var c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    var g = c.getContext('2d');
    g.fillStyle = '#5b5f64';
    g.fillRect(0, 0, w, h);
    for (var i = 0; i < 3200; i++) {
      var x = Math.random() * w, y = Math.random() * h, v = Math.random();
      g.fillStyle = v > 0.5
        ? 'rgba(255,255,255,' + (0.03 + v * 0.06) + ')'
        : 'rgba(0,0,0,' + (0.04 + v * 0.08) + ')';
      g.fillRect(x, y, 2, 2);
    }
    g.fillStyle = '#e9e9e0';
    g.fillRect(8, 0, 4, h);
    g.fillRect(w - 12, 0, 4, h);
    g.fillStyle = '#f2efe4';
    g.fillRect(w / 2 - 2, 0, 4, h * 0.46);
    var tex = new T.CanvasTexture(c);
    tex.wrapS = T.ClampToEdgeWrapping;
    tex.wrapT = T.RepeatWrapping;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    if (T.sRGBEncoding !== undefined) tex.encoding = T.sRGBEncoding;
    return tex;
  }

  /* ==================== дорожное полотно ==================== */
  var roadGeo = new T.BufferGeometry();
  var roadPosArr = new Float32Array(MAX_PTS * 6);
  var roadUvArr = new Float32Array(MAX_PTS * 4);
  var roadIdxArr = new Uint32Array((MAX_PTS - 1) * 6);
  (function () {
    for (var i = 0; i < MAX_PTS - 1; i++) {
      var a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1, o = i * 6;
      roadIdxArr[o] = a; roadIdxArr[o + 1] = b; roadIdxArr[o + 2] = c;
      roadIdxArr[o + 3] = b; roadIdxArr[o + 4] = d; roadIdxArr[o + 5] = c;
    }
  })();
  var roadPosAttr = new T.BufferAttribute(roadPosArr, 3);
  var roadUvAttr = new T.BufferAttribute(roadUvArr, 2);
  roadPosAttr.setUsage(T.DynamicDrawUsage);
  roadUvAttr.setUsage(T.DynamicDrawUsage);
  roadGeo.setAttribute('position', roadPosAttr);
  roadGeo.setAttribute('uv', roadUvAttr);
  roadGeo.setIndex(new T.BufferAttribute(roadIdxArr, 1));
  roadGeo.setDrawRange(0, 0);

  var roadMat = new T.MeshLambertMaterial({ map: makeRoadTexture(), flatShading: true });
  var roadMesh = new T.Mesh(roadGeo, roadMat);
  roadMesh.frustumCulled = false;
  scene.add(roadMesh);

  function buildRoad() {
    var n = Math.min(pts.length, MAX_PTS);
    for (var i = 0; i < n; i++) {
      var p = pts[i];
      var cx = Math.cos(p.h) * ROAD_HALF;
      var cz = -Math.sin(p.h) * ROAD_HALF;
      var o = i * 6;
      roadPosArr[o] = p.x + cx;
      roadPosArr[o + 1] = p.y;
      roadPosArr[o + 2] = p.z + cz;
      roadPosArr[o + 3] = p.x - cx;
      roadPosArr[o + 4] = p.y;
      roadPosArr[o + 5] = p.z - cz;
      var u = i * 4;
      roadUvArr[u] = 0; roadUvArr[u + 1] = p.s / 8;
      roadUvArr[u + 2] = 1; roadUvArr[u + 3] = p.s / 8;
    }
    roadPosAttr.needsUpdate = true;
    roadUvAttr.needsUpdate = true;
    roadGeo.setDrawRange(0, Math.max(0, (n - 1) * 6));
  }

  /* ==================== земля и холмы ==================== */
  var OFFS = [-170, -125, -90, -62, -42, -28, -17, -9, -ROAD_HALF,
              ROAD_HALF, 9, 17, 28, 42, 62, 90, 125, 170];
  var M = OFFS.length;

  function groundHeight(offset, s, ry) {
    var a = Math.abs(offset);
    if (a <= ROAD_HALF + 0.01) return ry - 0.07;
    var d = a - ROAD_HALF;
    var ramp = Math.min(1, d / 14);
    var n1 = Math.sin(s * 0.0105 + a * 0.045) * 0.5 +
             Math.sin(s * 0.0042 - a * 0.021 + 2.0) * 0.5;
    var far = Math.max(0, a - 45) * 0.18;
    return ry - 0.07 + ramp * ramp * (2.6 + n1 * 3.4) + far;
  }

  var groundGeo = new T.BufferGeometry();
  var gPosArr = new Float32Array(GROUND_MAX_ROWS * M * 3);
  var gColArr = new Float32Array(GROUND_MAX_ROWS * M * 3);
  var gIdxArr = new Uint32Array((GROUND_MAX_ROWS - 1) * (M - 1) * 6);
  (function () {
    var o = 0;
    for (var r = 0; r < GROUND_MAX_ROWS - 1; r++) {
      for (var m = 0; m < M - 1; m++) {
        var a = r * M + m, b = r * M + m + 1, c = (r + 1) * M + m, d = (r + 1) * M + m + 1;
        gIdxArr[o++] = a; gIdxArr[o++] = c; gIdxArr[o++] = b;
        gIdxArr[o++] = b; gIdxArr[o++] = c; gIdxArr[o++] = d;
      }
    }
  })();
  var gPosAttr = new T.BufferAttribute(gPosArr, 3);
  var gColAttr = new T.BufferAttribute(gColArr, 3);
  gPosAttr.setUsage(T.DynamicDrawUsage);
  gColAttr.setUsage(T.DynamicDrawUsage);
  groundGeo.setAttribute('position', gPosAttr);
  groundGeo.setAttribute('color', gColAttr);
  groundGeo.setIndex(new T.BufferAttribute(gIdxArr, 1));
  groundGeo.setDrawRange(0, 0);

  var groundMat = new T.MeshLambertMaterial({ color: 0x5d8a44, vertexColors: true, flatShading: true });
  var groundMesh = new T.Mesh(groundGeo, groundMat);
  groundMesh.frustumCulled = false;
  scene.add(groundMesh);

  function buildGround() {
    var rows = [];
    for (var i = 0; i < pts.length; i += 2) rows.push(pts[i]);
    if (rows.length === 0) return;
    if (rows[rows.length - 1] !== pts[pts.length - 1]) rows.push(pts[pts.length - 1]);
    var R = Math.min(rows.length, GROUND_MAX_ROWS);
    for (var r = 0; r < R; r++) {
      var p = rows[r];
      for (var m = 0; m < M; m++) {
        var off = OFFS[m];
        var cx = Math.cos(p.h) * off;
        var cz = -Math.sin(p.h) * off;
        var k = (r * M + m) * 3;
        gPosArr[k] = p.x + cx;
        gPosArr[k + 1] = groundHeight(off, p.s, p.y);
        gPosArr[k + 2] = p.z + cz;
        var v = 0.84 + ((Math.sin(p.s * 0.31 + m * 1.7) + 1) * 0.5) * 0.24;
        gColArr[k] = v;
        gColArr[k + 1] = v;
        gColArr[k + 2] = v;
      }
    }
    gPosAttr.needsUpdate = true;
    gColAttr.needsUpdate = true;
    groundGeo.setDrawRange(0, Math.max(0, (R - 1) * (M - 1) * 6));
  }

  /* ==================== деревья ==================== */
  var trunkGeo = new T.CylinderGeometry(0.16, 0.26, 2.0, 6);
  trunkGeo.translate(0, 1.0, 0);
  var crownGeo = new T.ConeGeometry(1.5, 4.2, 7);
  crownGeo.translate(0, 3.9, 0);

  var trunkMat = new T.MeshLambertMaterial({ color: 0x6b4a33, flatShading: true });
  var crownMat = new T.MeshLambertMaterial({ color: 0x2f6b3a, flatShading: true });

  var trunks = new T.InstancedMesh(trunkGeo, trunkMat, TREE_CAP);
  var crowns = new T.InstancedMesh(crownGeo, crownMat, TREE_CAP);
  trunks.frustumCulled = false;
  crowns.frustumCulled = false;
  trunks.count = 0;
  crowns.count = 0;
  scene.add(trunks);
  scene.add(crowns);

  function hash(n) {
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  var dummy = new T.Object3D();

  function buildTrees(sCar) {
    var from = Math.floor((sCar - BEHIND) / TREE_STEP);
    var to = Math.floor((sCar + AHEAD * 0.85) / TREE_STEP);
    var count = 0;
    for (var k = from; k <= to && count < TREE_CAP; k++) {
      var r1 = hash(k), r2 = hash(k + 0.37), r3 = hash(k + 1.71), r4 = hash(k + 2.93);
      if (r1 > 0.62) continue;
      var s = k * TREE_STEP + r3 * TREE_STEP;
      var side = r2 < 0.5 ? -1 : 1;
      var off = side * (12 + r4 * r4 * 46);
      var p = pointAt(s);
      var y = groundHeight(off, s, p.y);
      var sc = 0.75 + hash(k + 4.4) * 0.85;
      dummy.position.set(p.x + Math.cos(p.h) * off, y - 0.2, p.z - Math.sin(p.h) * off);
      dummy.rotation.set(0, hash(k + 5.1) * Math.PI * 2, 0);
      dummy.scale.set(sc, sc, sc);
      dummy.updateMatrix();
      trunks.setMatrixAt(count, dummy.matrix);
      crowns.setMatrixAt(count, dummy.matrix);
      count++;
    }
    trunks.count = count;
    crowns.count = count;
    trunks.instanceMatrix.needsUpdate = true;
    crowns.instanceMatrix.needsUpdate = true;
  }

  /* ==================== машина ==================== */
  var car = new T.Group();
  var bodyMat = new T.MeshLambertMaterial({ color: 0xd6483f, flatShading: true });
  var glassMat = new T.MeshLambertMaterial({ color: 0x1d2733, flatShading: true });
  var tireMat = new T.MeshLambertMaterial({ color: 0x15171a, flatShading: true });

  var body = new T.Mesh(new T.BoxGeometry(1.9, 0.52, 4.1), bodyMat);
  body.position.y = 0.66;
  car.add(body);

  var cabin = new T.Mesh(new T.BoxGeometry(1.62, 0.5, 1.85), glassMat);
  cabin.position.set(0, 1.13, -0.2);
  car.add(cabin);

  var roof = new T.Mesh(new T.BoxGeometry(1.66, 0.1, 1.7), bodyMat);
  roof.position.set(0, 1.4, -0.2);
  car.add(roof);

  var wheelGeo = new T.CylinderGeometry(0.36, 0.36, 0.3, 14);
  wheelGeo.rotateZ(Math.PI / 2);
  var wheels = [];
  var wheelPos = [[-0.92, 1.35], [0.92, 1.35], [-0.92, -1.35], [0.92, -1.35]];
  for (var wi = 0; wi < wheelPos.length; wi++) {
    var w = new T.Mesh(wheelGeo, tireMat);
    w.position.set(wheelPos[wi][0], 0.38, wheelPos[wi][1]);
    car.add(w);
    wheels.push(w);
  }
  scene.add(car);

  var shadow = new T.Mesh(
    new T.CircleGeometry(1.75, 24),
    new T.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.scale.set(1, 1.45, 1);
  scene.add(shadow);

  /* ==================== состояние ==================== */
  var sCar = 12;
  var speed = 0;
  var off = 0;
  var yaw = 0;
  var yawOffset = 0;
  var pitch = 0;
  var roll = 0;
  var paused = false;
  var viewMode = 0;
  var keys = { up: false, down: false, left: false, right: false };

  var hudSpeed = document.getElementById('speed');
  var hudDist = document.getElementById('dist');
  var btnPause = document.getElementById('btnPause');
  var btnView = document.getElementById('btnView');
  var btnTheme = document.getElementById('btnTheme');

  /* ==================== темы ==================== */
  var THEMES = [
    { name: 'День', skyTop: 0x4a90d9, skyBot: 0xcde7f7, fog: 0xcde7f7,
      hemiSky: 0xcfe8ff, hemiGround: 0x4c6b3f, sun: 0xfff6e0, sunI: 1.5,
      ambI: 0.25, grass: 0x5d8a44, crown: 0x2f6b3a },
    { name: 'Закат', skyTop: 0x2f3f6d, skyBot: 0xf6ab74, fog: 0xeba57e,
      hemiSky: 0xffc9a0, hemiGround: 0x4a3a33, sun: 0xffab66, sunI: 1.35,
      ambI: 0.2, grass: 0x6a7a3e, crown: 0x365f36 },
    { name: 'Ночь', skyTop: 0x04070f, skyBot: 0x1a2842, fog: 0x16223a,
      hemiSky: 0x33507a, hemiGround: 0x14201a, sun: 0x9fc0ff, sunI: 0.6,
      ambI: 0.16, grass: 0x2c3f2c, crown: 0x1d3a26 }
  ];
  var themeIdx = 0;

  function applyTheme(i) {
    var t = THEMES[i];
    skyUniforms.top.value.setHex(t.skyTop);
    skyUniforms.bot.value.setHex(t.skyBot);
    scene.fog.color.setHex(t.fog);
    hemi.color.setHex(t.hemiSky);
    hemi.groundColor.setHex(t.hemiGround);
    sun.color.setHex(t.sun);
    sun.intensity = t.sunI;
    ambient.intensity = t.ambI;
    groundMat.color.setHex(t.grass);
    crownMat.color.setHex(t.crown);
    btnTheme.textContent = t.name;
  }

  /* ==================== ввод ==================== */
  var KEYMAP = {
    arrowup: 'up', w: 'up', u: 'up', 'ц': 'up',
    arrowdown: 'down', s: 'down', 'ы': 'down',
    arrowleft: 'left', a: 'left', 'ф': 'left',
    arrowright: 'right', d: 'right', 'в': 'right'
  };

  window.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    if (KEYMAP[k]) { keys[KEYMAP[k]] = true; e.preventDefault(); return; }
    if (k === 'p' || k === 'escape' || k === 'з') { togglePause(); e.preventDefault(); }
    if (k === 'c' || k === 'с') { toggleView(); e.preventDefault(); }
  });

  window.addEventListener('keyup', function (e) {
    var k = (e.key || '').toLowerCase();
    if (KEYMAP[k]) { keys[KEYMAP[k]] = false; e.preventDefault(); }
  });

  function bindTouch() {
    var els = document.querySelectorAll('.key');
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        var k = el.getAttribute('data-k');
        var on = function (ev) { ev.preventDefault(); keys[k] = true; };
        var offFn = function (ev) { ev.preventDefault(); keys[k] = false; };
        el.addEventListener('pointerdown', on);
        el.addEventListener('pointerup', offFn);
        el.addEventListener('pointercancel', offFn);
        el.addEventListener('pointerleave', offFn);
      })(els[i]);
    }
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
      document.getElementById('touch').style.display = 'flex';
    }
  }
  bindTouch();

  function togglePause() {
    paused = !paused;
    btnPause.textContent = paused ? 'Дальше' : 'Пауза';
  }
  function toggleView() {
    viewMode = viewMode === 0 ? 1 : 0;
    btnView.textContent = viewMode === 0 ? 'Вид' : 'Капот';
    camInit = false;
  }

  btnPause.addEventListener('click', togglePause);
  btnView.addEventListener('click', toggleView);
  btnTheme.addEventListener('click', function () {
    themeIdx = (themeIdx + 1) % THEMES.length;
    applyTheme(themeIdx);
  });

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ==================== обновление ==================== */
  var camInit = false;
  var tmpFwd = new T.Vector3();
  var tmpDesired = new T.Vector3();
  var tmpLook = new T.Vector3();
  var tmpUp = new T.Vector3(0, 1, 0);
  var hudAcc = 0;

  function update(dt) {
    if (!paused) {
      var accel = 13, brake = 26;
      if (keys.up) speed += accel * dt * (1 - Math.min(1, speed / MAX_SPEED) * 0.55);
      if (keys.down) speed -= brake * dt;
      if (!keys.up && !keys.down) speed -= speed * 0.55 * dt;
      speed -= speed * 0.02 * dt;
      if (speed > MAX_SPEED) speed = MAX_SPEED;
      if (speed < -6) speed = -6;

      var steer = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      var steerPower = 1.0 + Math.min(1, Math.abs(speed) / 14) * 2.2;
      off += steer * steerPower * dt * (speed >= 0 ? 1 : -1);
      var limit = ROAD_HALF + 1.2;
      if (off > limit) off = limit;
      if (off < -limit) off = -limit;

      if (Math.abs(off) > ROAD_HALF - 0.3) speed -= speed * 0.85 * dt;

      sCar += speed * dt;
      if (sCar < 0) { sCar = 0; if (speed < 0) speed = 0; }

      var targetOffset = steer * 0.22 * Math.min(1, Math.abs(speed) / 9) * (speed >= 0 ? 1 : -1);
      yawOffset += (targetOffset - yawOffset) * Math.min(1, dt * 7);
    }

    var p = pointAt(sCar);
    var ahead = pointAt(sCar + 3);
    var behind = pointAt(sCar - 3);

    var rightX = Math.cos(p.h);
    var rightZ = -Math.sin(p.h);
    car.position.set(p.x + rightX * off, p.y + 0.02, p.z + rightZ * off);

    yaw = p.h + yawOffset;
    var slope = (ahead.y - behind.y) / 6;
    var targetPitch = -Math.atan(slope);
    pitch += (targetPitch - pitch) * Math.min(1, dt * 6);
    var targetRoll = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    targetRoll = -targetRoll * 0.05 * Math.min(1, Math.abs(speed) / 20);
    roll += (targetRoll - roll) * Math.min(1, dt * 6);

    car.rotation.set(0, 0, 0);
    car.rotateY(yaw);
    car.rotateX(pitch);
    car.rotateZ(roll);

    shadow.position.set(car.position.x, p.y + 0.04, car.position.z);

    var spin = speed * dt / 0.36;
    for (var i = 0; i < wheels.length; i++) wheels[i].rotation.x += spin;

    /* камера */
    tmpFwd.set(Math.sin(yaw), 0, Math.cos(yaw));

    if (viewMode === 0) {
      var dist = 9.5 + speed * 0.08;
      var height = 4.0 + speed * 0.02;
      tmpDesired.copy(car.position).addScaledVector(tmpFwd, -dist);
      tmpDesired.y += height;
      if (!camInit) { camera.position.copy(tmpDesired); camInit = true; }
      camera.position.lerp(tmpDesired, 1 - Math.exp(-dt * 3.2));
      tmpLook.copy(car.position).addScaledVector(tmpFwd, 10);
      tmpLook.y += 1.1;
    } else {
      tmpDesired.copy(car.position).addScaledVector(tmpFwd, 0.9);
      tmpDesired.y += 1.45;
      if (!camInit) { camera.position.copy(tmpDesired); camInit = true; }
      camera.position.lerp(tmpDesired, 1 - Math.exp(-dt * 14));
      tmpLook.copy(car.position).addScaledVector(tmpFwd, 40);
      tmpLook.y += 1.1;
    }
    camera.lookAt(tmpLook);

    var targetFov = 62 + (Math.abs(speed) / MAX_SPEED) * 12;
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 3);
    camera.updateProjectionMatrix();

    sky.position.copy(camera.position);

    hudAcc += dt;
    if (hudAcc > 0.1) {
      hudAcc = 0;
      hudSpeed.innerHTML = Math.round(Math.abs(speed) * 3.6) + '<span>км/ч</span>';
      hudDist.textContent = (sCar / 1000).toFixed(2) + ' км';
    }
  }

  /* ==================== запуск ==================== */
  applyTheme(0);
  ensureRoad(sCar);
  buildRoad();
  buildGround();
  buildTrees(sCar);
  update(0);
  loadingEl.style.display = 'none';

  var last = performance.now();
  var buildAcc = 0;

  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.08) dt = 0.08;
    if (dt < 0) dt = 0;

    var changed = ensureRoad(sCar);
    update(dt);

    buildAcc += dt;
    if (buildAcc > 0.12 || changed) {
      buildAcc = 0;
      buildRoad();
      buildGround();
      buildTrees(sCar);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
