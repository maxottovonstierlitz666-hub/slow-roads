<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#87b7d9">
<title>Slow Roads — бесконечная дорога</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b1016; color:#fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display:block; }
  #hud { position:fixed; top:0; left:0; right:0; padding:14px 16px; display:flex;
    justify-content:space-between; align-items:flex-start; pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,.55); }
  #speed { font-size:34px; font-weight:700; line-height:1; letter-spacing:-1px; }
  #speed span { font-size:12px; font-weight:500; opacity:.75; margin-left:4px; letter-spacing:0; }
  #dist { font-size:12px; opacity:.85; margin-top:5px; }
  #buttons { display:flex; gap:8px; pointer-events:auto; flex-wrap:wrap; justify-content:flex-end; }
  .btn { border:none; background:rgba(12,18,26,.42); color:#fff; backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.16);
    border-radius:12px; padding:9px 12px; font-size:12px; font-weight:600; cursor:pointer;
    font-family:inherit; }
  .btn:active { transform:scale(.95); }
  #touch { position:fixed; left:0; right:0; bottom:0; padding:16px 18px calc(18px + env(safe-area-inset-bottom));
    display:none; justify-content:space-between; gap:14px; pointer-events:none; }
  .pad { display:flex; gap:12px; pointer-events:auto; }
  .key { width:64px; height:64px; border-radius:18px; background:rgba(12,18,26,.42);
    border:1px solid rgba(255,255,255,.16); backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center;
    font-size:22px; user-select:none; -webkit-user-select:none; touch-action:none; }
  .key:active { background:rgba(255,255,255,.26); }
  #hint { position:fixed; left:16px; bottom:16px; font-size:12px; opacity:.62; line-height:1.7;
    text-shadow:0 1px 4px rgba(0,0,0,.6); }
  @media (max-width:820px){ #hint{display:none;} #speed{font-size:28px;} }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div>
    <div id="speed">0<span>км/ч</span></div>
    <div id="dist">0.00 км</div>
  </div>
  <div id="buttons">
    <button class="btn" id="btnTheme">День</button>
    <button class="btn" id="btnPause">Пауза</button>
  </div>
</div>

<div id="touch">
  <div class="pad">
    <div class="key" data-k="left">◀</div>
    <div class="key" data-k="right">▶</div>
  </div>
  <div class="pad">
    <div class="key" data-k="down">▼</div>
    <div class="key" data-k="up">▲</div>
  </div>
</div>

<div id="hint">W / ↑ — газ&nbsp;&nbsp;·&nbsp;&nbsp;S / ↓ — тормоз<br>A / D — руль&nbsp;&nbsp;·&nbsp;&nbsp;P — пауза</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ==================== параметры мира ==================== */
  var SEG_LEN = 200;          // длина сегмента, условных единиц
  var RUMBLE_LEN = 3;         // сколько сегментов в одной «полосе» покрытия
  var ROAD_WIDTH = 2000;      // ширина полотна
  var CAM_HEIGHT = 1000;      // высота камеры над дорогой
  var FOV = 100;
  var CAM_DEPTH = 1 / Math.tan((FOV / 2) * Math.PI / 180);
  var DRAW_DIST = 160;        // сколько сегментов рисуем

  var MAX_SPEED = SEG_LEN * 55;   // ~200 км/ч в пересчёте HUD
  var ACCEL = MAX_SPEED / 6;
  var BRAKING = -MAX_SPEED / 1.8;
  var DECEL = -MAX_SPEED / 14;
  var OFF_ROAD_DECEL = -MAX_SPEED / 2.2;
  var OFF_ROAD_LIMIT = MAX_SPEED / 4;
  var CENTRIFUGAL = 0.32;
  var FOG_STEPS = 16;

  /* ==================== процедурная дорога ==================== */
  // Кривизна и высота — гладкие функции от номера сегмента.
  // Ничего не храним: дорога бесконечна в обе стороны и не занимает память.
  function curveAt(i) {
    return 2.6 * Math.sin(i * 0.0089 + 0.4) +
           1.3 * Math.sin(i * 0.0031 + 2.1) +
           0.45 * Math.sin(i * 0.023 + 5.0);
  }
  function yAt(i) {
    return 3200 * Math.sin(i * 0.0042 + 0.9) +
           1500 * Math.sin(i * 0.0113 + 2.4);
  }
  function hash(n) {
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  /* ==================== темы ==================== */
  var THEMES = [
    {
      name: 'День',
      skyTop: '#4a90d9', skyBot: '#cfe7f7', sun: '#fff9e6', sunY: 0.22,
      grass1: '#4f7c3c', grass2: '#477236',
      road1: '#5d6166', road2: '#565a5f',
      rumble1: '#e8e8df', rumble2: '#d8d8cf',
      line: '#f2efe4',
      crown: '#2f6b3a', crown2: '#255630', trunk: '#5b3f2b',
      mount1: '#6d8f7a', mount2: '#87a894',
      stars: false
    },
    {
      name: 'Закат',
      skyTop: '#2f3f6d', skyBot: '#f6ab74', sun: '#fff0c4', sunY: 0.42,
      grass1: '#5c6c3a', grass2: '#536234',
      road1: '#565258', road2: '#4f4b52',
      rumble1: '#e6d2b8', rumble2: '#d3bfa6',
      line: '#f4e6cd',
      crown: '#3c5c3a', crown2: '#2e4a2e', trunk: '#4a3423',
      mount1: '#40406b', mount2: '#5c5a84',
      stars: false
    },
    {
      name: 'Ночь',
      skyTop: '#050a16', skyBot: '#16233d', sun: '#e9f0ff', sunY: 0.2,
      grass1: '#22331f', grass2: '#1d2b1a',
      road1: '#3a3d44', road2: '#34373d',
      rumble1: '#8d8f93', rumble2: '#7c7e82',
      line: '#b9bcc2',
      crown: '#16301c', crown2: '#102415', trunk: '#2a1e14',
      mount1: '#101a2c', mount2: '#182740',
      stars: true
    }
  ];
  var themeIdx = 0;
  var TBL = null;

  function hexToRgb(h) {
    return [
      parseInt(h.slice(1, 3), 16),
      parseInt(h.slice(3, 5), 16),
      parseInt(h.slice(5, 7), 16)
    ];
  }
  function makeRamp(base, fogc) {
    var b = hexToRgb(base);
    var f = hexToRgb(fogc);
    var arr = [];
    for (var k = 0; k < FOG_STEPS; k++) {
      var t = k / (FOG_STEPS - 1);
      arr.push('rgb(' +
        Math.round(b[0] + (f[0] - b[0]) * t) + ',' +
        Math.round(b[1] + (f[1] - b[1]) * t) + ',' +
        Math.round(b[2] + (f[2] - b[2]) * t) + ')');
    }
    return arr;
  }

  function buildTables() {
    var t = THEMES[themeIdx];
    TBL = {
      grass: [makeRamp(t.grass1, t.skyBot), makeRamp(t.grass2, t.skyBot)],
      road: [makeRamp(t.road1, t.skyBot), makeRamp(t.road2, t.skyBot)],
      rumble: [makeRamp(t.rumble1, t.skyBot), makeRamp(t.rumble2, t.skyBot)],
      line: makeRamp(t.line, t.skyBot),
      crown: makeRamp(t.crown, t.skyBot),
      crown2: makeRamp(t.crown2, t.skyBot),
      trunk: makeRamp(t.trunk, t.skyBot)
    };
    document.getElementById('btnTheme').textContent = t.name;
  }
  buildTables();

  /* ==================== состояние ==================== */
  var position = 0;
  var speed = 0;
  var playerX = 0;
  var paused = false;
  var skyShift = 0;
  var keys = { up: false, down: false, left: false, right: false };

  var hudSpeed = document.getElementById('speed');
  var hudDist = document.getElementById('dist');
  var btnPause = document.getElementById('btnPause');

  /* ==================== ввод ==================== */
  var KEYMAP = {
    arrowup: 'up', w: 'up', 'ц': 'up',
    arrowdown: 'down', s: 'down', 'ы': 'down',
    arrowleft: 'left', a: 'left', 'ф': 'left',
    arrowright: 'right', d: 'right', 'в': 'right'
  };

  window.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    if (KEYMAP[k]) { keys[KEYMAP[k]] = true; e.preventDefault(); return; }
    if (k === 'p' || k === 'escape' || k === 'з') { togglePause(); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    var k = (e.key || '').toLowerCase();
    if (KEYMAP[k]) { keys[KEYMAP[k]] = false; e.preventDefault(); }
  });

  (function bindTouch() {
    var els = document.querySelectorAll('.key');
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        var k = el.getAttribute('data-k');
        var on = function (ev) { ev.preventDefault(); keys[k] = true; };
        var off = function (ev) { ev.preventDefault(); keys[k] = false; };
        el.addEventListener('pointerdown', on);
        el.addEventListener('pointerup', off);
        el.addEventListener('pointercancel', off);
        el.addEventListener('pointerleave', off);
      })(els[i]);
    }
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
      document.getElementById('touch').style.display = 'flex';
    }
  })();

  function togglePause() {
    paused = !paused;
    btnPause.textContent = paused ? 'Дальше' : 'Пауза';
  }
  btnPause.addEventListener('click', togglePause);
  document.getElementById('btnTheme').addEventListener('click', function () {
    themeIdx = (themeIdx + 1) % THEMES.length;
    buildTables();
  });

  /* ==================== физика ==================== */
  function update(dt) {
    if (paused) return;
    var base = Math.floor(position / SEG_LEN);
    var curve = curveAt(base);
    var speedPercent = speed / MAX_SPEED;

    var dx = dt * 2 * speedPercent;
    if (keys.left) playerX -= dx;
    if (keys.right) playerX += dx;
    playerX -= dx * speedPercent * curve * CENTRIFUGAL;

    if (keys.up) speed += ACCEL * dt;
    else if (keys.down) speed += BRAKING * dt;
    else speed += DECEL * dt;

    if ((playerX < -1 || playerX > 1) && speed > OFF_ROAD_LIMIT) {
      speed += OFF_ROAD_DECEL * dt;
    }

    if (speed > MAX_SPEED) speed = MAX_SPEED;
    if (speed < 0) speed = 0;

    position += speed * dt;
    if (playerX < -2) playerX = -2;
    if (playerX > 2) playerX = 2;

    skyShift += curve * speed * dt * 0.00002;
  }

  /* ==================== рисование ==================== */
  function project(z, worldY, worldX, camY, camX) {
    var scale = CAM_DEPTH / z;
    return {
      scale: scale,
      x: W / 2 + scale * (worldX - camX) * W / 2,
      y: H / 2 - scale * (worldY - camY) * H / 2,
      w: scale * ROAD_WIDTH * W / 2
    };
  }

  function poly(pts, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fill();
  }

  function fogIndex(k) {
    var v = Math.round(k * (FOG_STEPS - 1));
    if (v < 0) v = 0;
    if (v > FOG_STEPS - 1) v = FOG_STEPS - 1;
    return v;
  }

  function drawSky(horizonY) {
    var t = THEMES[themeIdx];
    var grad = ctx.createLinearGradient(0, 0, 0, Math.max(horizonY, 1));
    grad.addColorStop(0, t.skyTop);
    grad.addColorStop(1, t.skyBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // звёзды
    if (t.stars) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (var i = 0; i < 90; i++) {
        var sx = (hash(i * 3.1) * W + skyShift * 20) % W;
        if (sx < 0) sx += W;
        var sy = hash(i * 7.7) * Math.max(horizonY * 0.9, 10);
        var r = hash(i * 1.3) * 1.3 + 0.4;
        ctx.fillRect(sx, sy, r, r);
      }
    }

    // солнце / луна
    var sunX = W / 2 - skyShift * 60;
    var sunY = H * t.sunY;
    var sunR = Math.min(W, H) * 0.055;
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = t.sun;
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.18;
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR * 2.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // дальние горы
    drawMountains(horizonY, t.mount2, 0.55, 70, 0.004);
    drawMountains(horizonY, t.mount1, 1.0, 110, 0.009);
  }

  function drawMountains(horizonY, color, ampK, heightPx, freq) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, horizonY + 4);
    var step = Math.max(14, W / 60);
    for (var x = 0; x <= W + step; x += step) {
      var phase = (x + skyShift * 260 * ampK) * freq;
      var h = (Math.sin(phase) * 0.5 + Math.sin(phase * 2.3 + 1.7) * 0.3 +
               Math.sin(phase * 0.6 + 3.1) * 0.4);
      var y = horizonY - (heightPx * ampK) * (0.55 + h * 0.45);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, horizonY + 4);
    ctx.closePath();
    ctx.fill();
  }

  function drawTree(x, groundY, size, fi, seed) {
    // ствол
    var trunkW = Math.max(1, size * 0.07);
    ctx.fillStyle = TBL.trunk[fi];
    ctx.fillRect(x - trunkW / 2, groundY - size * 0.32, trunkW, size * 0.32);

    // крона — два яруса
    var crownColor = seed > 0.5 ? TBL.crown[fi] : TBL.crown2[fi];
    ctx.fillStyle = crownColor;

    var w1 = size * 0.30;
    ctx.beginPath();
    ctx.moveTo(x, groundY - size);
    ctx.lineTo(x + w1, groundY - size * 0.42);
    ctx.lineTo(x - w1, groundY - size * 0.42);
    ctx.closePath();
    ctx.fill();

    var w2 = size * 0.38;
    ctx.beginPath();
    ctx.moveTo(x, groundY - size * 0.72);
    ctx.lineTo(x + w2, groundY - size * 0.14);
    ctx.lineTo(x - w2, groundY - size * 0.14);
    ctx.closePath();
    ctx.fill();
  }

  function render() {
    var base = Math.floor(position / SEG_LEN);
    var basePercent = (position - base * SEG_LEN) / SEG_LEN;
    var playerY = yAt(base) + (yAt(base + 1) - yAt(base)) * basePercent;
    var camY = playerY + CAM_HEIGHT;
    var camX = playerX * ROAD_WIDTH;

    var horizonY = H * 0.42;
    drawSky(horizonY);

    var maxy = H;
    var x = 0;
    var dx = -(curveAt(base) * basePercent);
    var trees = [];

    for (var n = 0; n < DRAW_DIST; n++) {
      var i = base + n;
      var curve = curveAt(i);
      var z1 = i * SEG_LEN - position;
      var z2 = (i + 1) * SEG_LEN - position;
      if (z1 < 40) continue;

      var p1 = project(z1, yAt(i), x, camY, camX);
      var p2 = project(z2, yAt(i + 1), x + dx, camY, camX);

      x += dx;
      dx += curve;

      if (p2.y >= p1.y) continue;
      if (p2.y >= maxy) continue;

      var fogK = Math.min(1, Math.pow(n / DRAW_DIST, 1.25));
      var fi = fogIndex(fogK);
      var dark = Math.floor(i / RUMBLE_LEN) % 2 === 0 ? 0 : 1;

      // трава
      ctx.fillStyle = TBL.grass[dark][fi];
      ctx.fillRect(0, p2.y, W, p1.y - p2.y + 1);

      // обочина шире полотна
      var r1 = p1.w * 1.10, r2 = p2.w * 1.10;
      poly([[p1.x - r1, p1.y], [p1.x + r1, p1.y],
            [p2.x + r2, p2.y], [p2.x - r2, p2.y]], TBL.rumble[dark][fi]);

      // полотно
      poly([[p1.x - p1.w, p1.y], [p1.x + p1.w, p1.y],
            [p2.x + p2.w, p2.y], [p2.x - p2.w, p2.y]], TBL.road[dark][fi]);

      // центральная прерывистая разметка
      if (Math.floor(i / RUMBLE_LEN) % 2 === 0) {
        var lw1 = Math.max(0.6, p1.w * 0.022);
        var lw2 = Math.max(0.4, p2.w * 0.022);
        poly([[p1.x - lw1, p1.y], [p1.x + lw1, p1.y],
              [p2.x + lw2, p2.y], [p2.x - lw2, p2.y]], TBL.line[fi]);
      }

      // краевые линии
      if (p1.w > 3) {
        var ew1 = Math.max(0.5, p1.w * 0.016);
        var ew2 = Math.max(0.4, p2.w * 0.016);
        var off1 = p1.w * 0.93, off2 = p2.w * 0.93;
        poly([[p1.x - off1 - ew1, p1.y], [p1.x - off1 + ew1, p1.y],
              [p2.x - off2 + ew2, p2.y], [p2.x - off2 - ew2, p2.y]], TBL.line[fi]);
        poly([[p1.x + off1 - ew1, p1.y], [p1.x + off1 + ew1, p1.y],
              [p2.x + off2 + ew2, p2.y], [p2.x + off2 - ew2, p2.y]], TBL.line[fi]);
      }

      // деревья вдоль дороги
      if (n > 2 && hash(i) < 0.42) {
        var side = hash(i + 0.5) < 0.5 ? -1 : 1;
        var offsetK = 1.35 + hash(i + 1.7) * 2.4;
        trees.push({
          x: p1.x + side * offsetK * p1.w,
          y: p1.y,
          size: p1.w * (0.85 + hash(i + 3.3) * 0.5),
          fi: fi,
          seed: hash(i + 5.1),
          depth: n
        });
      }

      maxy = p1.y;
    }

    // деревья — от дальних к ближним
    for (var t = trees.length - 1; t >= 0; t--) {
      var tr = trees[t];
      if (tr.size < 1.2) continue;
      drawTree(tr.x, tr.y, tr.size, tr.fi, tr.seed);
    }

    // машина игрока
    drawPlayer();
  }

  function drawPlayer() {
    var base = Math.floor(position / SEG_LEN);
    var yB = yAt(base);
    var speedK = speed / MAX_SPEED;
    var carW = Math.min(W * 0.26, 150);
    var carH = carW * 0.42;
    var cx = W / 2;
    var cy = H * 0.93;

    // тень
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + carH * 0.55, carW * 0.55, carH * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();

    // кузов
    var bodyGrad = ctx.createLinearGradient(cx, cy - carH, cx, cy + carH);
    bodyGrad.addColorStop(0, '#e2564c');
    bodyGrad.addColorStop(1, '#a8332c');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(cx - carW / 2, cy + carH * 0.42);
    ctx.lineTo(cx - carW * 0.40, cy - carH * 0.22);
    ctx.lineTo(cx + carW * 0.40, cy - carH * 0.22);
    ctx.lineTo(cx + carW / 2, cy + carH * 0.42);
    ctx.closePath();
    ctx.fill();

    // крыша
    ctx.fillStyle = '#1d2733';
    ctx.beginPath();
    ctx.moveTo(cx - carW * 0.28, cy - carH * 0.20);
    ctx.lineTo(cx - carW * 0.20, cy - carH * 0.60);
    ctx.lineTo(cx + carW * 0.20, cy - carH * 0.60);
    ctx.lineTo(cx + carW * 0.28, cy - carH * 0.20);
    ctx.closePath();
    ctx.fill();

    // блик на крыше
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(cx - carW * 0.17, cy - carH * 0.58, carW * 0.34, carH * 0.08);

    // задние фонари
    ctx.fillStyle = '#ff6b5e';
    ctx.fillRect(cx - carW * 0.46, cy + carH * 0.10, carW * 0.14, carH * 0.12);
    ctx.fillRect(cx + carW * 0.32, cy + carH * 0.10, carW * 0.14, carH * 0.12);

    // колёса
    ctx.fillStyle = '#14161a';
    ctx.fillRect(cx - carW * 0.52, cy + carH * 0.18, carW * 0.10, carH * 0.34);
    ctx.fillRect(cx + carW * 0.42, cy + carH * 0.18, carW * 0.10, carH * 0.34);

    // «дым» из-под колёс на скорости
    if (speedK > 0.55) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + speedK * 0.05) + ')';
      var dustW = carW * (0.5 + Math.sin(performance.now() * 0.006) * 0.15);
      ctx.beginPath();
      ctx.ellipse(cx, cy + carH * 0.5, dustW, carH * 0.12, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    void yB;
  }

  /* ==================== HUD ==================== */
  var hudAcc = 0;
  function updateHud(dt) {
    hudAcc += dt;
    if (hudAcc < 0.1) return;
    hudAcc = 0;
    var kmh = Math.round((speed / MAX_SPEED) * 200);
    hudSpeed.innerHTML = kmh + '<span>км/ч</span>';
    hudDist.textContent = (position * 0.000005).toFixed(2) + ' км';
  }

  /* ==================== главный цикл ==================== */
  var last = performance.now();
  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    update(dt);
    render();
    updateHud(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
